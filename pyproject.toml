[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendm"
dynamic = ["version"]
description = "Free, open-source download manager for Windows."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Indrajit Gupta", email = "indrajitgupta147@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["httpx>=0.28,<1", "PySide6-Essentials>=6.12,<7"]

[project.scripts]
opendm-cli = "opendm.cli.__main__:main"

[project.gui-scripts]
opendm = "opendm.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-qt>=4.5",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/Indrajit147/OpenDM"

[tool.setuptools.dynamic]
version = { attr = "opendm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"opendm.storage.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["opendm", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# basetemp keeps test downloads inside the repo (off C:); pytest clears it each run.
addopts = "-m 'not live' --basetemp=build/pytest-tmp"
markers = [
    "live: hits the real internet; skipped by default",
    "tools: needs real yt-dlp/FFmpeg (set OPENDM_TEST_TOOLS); skipped otherwise",
]
asyncio_mode = "auto"
qt_api = "pyside6"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["opendm"]
branch = true
