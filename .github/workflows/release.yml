name: Release

# Pushing a version tag (v0.8.0, or v0.8.0-rc.1 for a test release) builds and tests
# everything and creates a DRAFT release. Nothing is public until someone presses Publish
# on GitHub (decision D64).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the draft release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Tag must match the app version
        shell: pwsh
        run: |
          $version = python -c "import opendm; print(opendm.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Output "::error::tag ${{ github.ref_name }} does not match opendm.__version__ ($version)"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Extension tests
        run: node --test extension/tests/logic.test.mjs extension/tests/manifest.test.mjs

      - name: Test
        run: python -m pytest -q

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.4 --no-progress -y
          }
          if (-not (Test-Path $iscc)) { Write-Output "::error::ISCC.exe not found"; exit 1 }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Code signing (D69, docs/CODE_SIGNING.md) runs only once SignPath has accepted the
      # project and the repository variable SIGNPATH_ORGANIZATION_ID is set; until then the
      # build is unsigned and these steps are skipped. The programs are signed first, then
      # packaged into the ZIP and installer, then the installer itself is signed.
      - name: Build the programs
        run: python scripts/build.py --stage programs

      - name: Upload programs for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-programs
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-programs
          path: |
            dist/OpenDM/OpenDM.exe
            dist/OpenDM/opendm-cli.exe
            dist/OpenDM/opendm-host.exe

      - name: Sign the programs (SignPath, waits for approval)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/OpenDM

      - name: Build installer and portable ZIP
        run: python scripts/build.py --stage package --iscc "${{ env.ISCC }}"

      - name: Upload installer for signing
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/OpenDM-${{ env.VERSION }}-setup.exe

      - name: Sign the installer (SignPath, waits for approval)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Smoke test (portable ZIP)
        run: python scripts/smoke_dist.py

      - name: Install, upgrade and uninstall test
        run: python scripts/installer_test.py

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $files = @("OpenDM-$env:VERSION-setup.exe", "OpenDM-$env:VERSION-portable.zip")
          $lines = foreach ($name in $files) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          [IO.File]::WriteAllText("dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt
          python scripts/release_notes.py "${{ github.ref_name }}" > dist/notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @("--draft", "--title", "OpenDM $env:VERSION", "--notes-file", "dist/notes.md")
          if ($env:VERSION.Contains("-")) { $flags += "--prerelease" }
          gh release create "${{ github.ref_name }}" @flags `
            "dist/OpenDM-$env:VERSION-setup.exe" `
            "dist/OpenDM-$env:VERSION-portable.zip" `
            "dist/SHA256SUMS.txt"
