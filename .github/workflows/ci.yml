name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: python -m pytest -q --cov --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Annotate test failures
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path pytest-report.xml)) {
            Write-Output "::error::pytest produced no report (crashed before running tests)"
            exit 0
          }
          [xml]$report = Get-Content pytest-report.xml
          foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
            $node = $case.SelectSingleNode('failure|error')
            $text = "$($node.message)`n$($node.InnerText)"
            if ($text.Length -gt 1500) { $text = $text.Substring($text.Length - 1500) }
            $text = $text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=$($case.classname)::$($case.name)%0A$text"
          }
