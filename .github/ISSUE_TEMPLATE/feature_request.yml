name: Feature request
description: An idea to make OpenDM better
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could OpenDM help?
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: This does not involve bypassing DRM, paywalls, logins or CAPTCHAs.
          required: true
